<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="hnlabel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f4a2f"/></marker></defs><rect width="720" height="210" fill="#fff"/><rect x="20" y="20" width="250" height="96" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.4"/><text x="145" y="42" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >太閤検地</text><text x="145" y="68" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >田畑の面積やよしあしを調べ、</text><text x="145" y="86" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >収穫量を石高で表す</text><text x="145" y="104" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >耕す農民を検地帳に登録</text><rect x="20" y="126" width="250" height="74" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.4"/><text x="145" y="148" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >刀狩</text><text x="145" y="174" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >農民から刀や鉄砲を取り上げる</text><text x="145" y="192" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（一揆を防ぐ）</text><path d="M275 68 L400 100" stroke="#8f4a2f" stroke-width="2.4" marker-end="url(#hnlabel)"/><path d="M275 163 L400 128" stroke="#8f4a2f" stroke-width="2.4" marker-end="url(#hnlabel)"/><rect x="410" y="60" width="290" height="96" rx="8" fill="#f3dccc" stroke="#8f4a2f" stroke-width="1.4"/><text x="555" y="82" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >兵農分離</text><text x="555" y="108" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >武士と農民の身分が</text><text x="555" y="126" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >はっきり分かれる</text></svg>