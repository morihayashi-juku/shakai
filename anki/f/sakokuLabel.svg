<svg viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="sklabel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f4a2f"/></marker></defs><rect width="760" height="150" fill="#fff"/><rect x="6" y="22" width="114" height="104" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.2"/><text x="63" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1612年</text><text x="63" y="72" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >禁教令（幕府領）</text><line x1="121" y1="74" x2="130" y2="74" stroke="#8f4a2f" stroke-width="2.2" marker-end="url(#sklabel)"/><rect x="132" y="22" width="114" height="104" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.2"/><text x="189" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1624年</text><text x="189" y="62" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >スペイン船の</text><text x="189" y="82" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >来航を禁止</text><line x1="247" y1="74" x2="256" y2="74" stroke="#8f4a2f" stroke-width="2.2" marker-end="url(#sklabel)"/><rect x="258" y="22" width="114" height="104" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.2"/><text x="315" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1635年</text><text x="315" y="62" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >日本人の海外渡</text><text x="315" y="82" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >航・帰国を禁止</text><line x1="373" y1="74" x2="382" y2="74" stroke="#8f4a2f" stroke-width="2.2" marker-end="url(#sklabel)"/><rect x="384" y="22" width="114" height="104" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.2"/><text x="441" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1637年</text><text x="441" y="72" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >島原・天草一揆</text><line x1="499" y1="74" x2="508" y2="74" stroke="#8f4a2f" stroke-width="2.2" marker-end="url(#sklabel)"/><rect x="510" y="22" width="114" height="104" rx="8" fill="#f6efe4" stroke="#8f4a2f" stroke-width="1.2"/><text x="567" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1639年</text><text x="567" y="62" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >ポルトガル船</text><text x="567" y="82" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >の来航を禁止</text><line x1="625" y1="74" x2="634" y2="74" stroke="#8f4a2f" stroke-width="2.2" marker-end="url(#sklabel)"/><rect x="636" y="22" width="114" height="104" rx="8" fill="#f3dccc" stroke="#8f4a2f" stroke-width="1.2"/><text x="693" y="40" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >1641年</text><text x="693" y="62" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >オランダ商</text><text x="693" y="82" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >館を出島へ</text><text x="380" y="12" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >鎖国への流れ</text><text x="380" y="141" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >→ 鎖国の完成</text></svg>