<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="760" height="300" fill="#fff"/><rect x="250" y="12" width="260" height="44" rx="8" fill="#cfe3d2" stroke="#3b6a4c" stroke-width="1.4"/><text x="380" y="34" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >個人の尊重（第13条）</text><line x1="380" y1="58" x2="84" y2="96" stroke="#3b6a4c" stroke-width="1.6"/><rect x="20" y="98" width="128" height="70" rx="8" fill="#cfe3d2" stroke="#1d2a33" stroke-width="1.4"/><text x="84" y="120" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >平等権</text><text x="84" y="148" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >差別されない</text><line x1="380" y1="58" x2="232" y2="96" stroke="#3b6a4c" stroke-width="1.6"/><rect x="168" y="98" width="128" height="70" rx="8" fill="#f3dccc" stroke="#1d2a33" stroke-width="1.4"/><text x="232" y="120" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >自由権</text><text x="232" y="148" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >精神・身体・経済活動</text><line x1="380" y1="58" x2="380" y2="96" stroke="#3b6a4c" stroke-width="1.6"/><rect x="316" y="98" width="128" height="70" rx="8" fill="#dde6f2" stroke="#1d2a33" stroke-width="1.4"/><text x="380" y="120" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >社会権</text><text x="380" y="148" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >人間らしい生活</text><line x1="380" y1="58" x2="528" y2="96" stroke="#3b6a4c" stroke-width="1.6"/><rect x="464" y="98" width="128" height="70" rx="8" fill="#f3ead0" stroke="#1d2a33" stroke-width="1.4"/><text x="528" y="120" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >参政権</text><text x="528" y="148" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >政治に参加する</text><line x1="380" y1="58" x2="676" y2="96" stroke="#3b6a4c" stroke-width="1.6"/><rect x="612" y="98" width="128" height="70" rx="8" fill="#e6dcef" stroke="#1d2a33" stroke-width="1.4"/><text x="676" y="120" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >請求権</text><text x="676" y="148" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国に求める</text><rect x="150" y="196" width="460" height="46" rx="8" fill="#fff" stroke="#8f4a2f" stroke-width="1.4" stroke-dasharray="5 4"/><text x="380" y="212" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >新しい人権（憲法に直接は書かれていない）</text><text x="380" y="230" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >環境権・自己決定権・知る権利・プライバシーの権利</text><text x="380" y="270" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" >人権は「公共の福祉」によって制限されることがある</text></svg>