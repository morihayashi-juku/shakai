<svg viewBox="0 0 540 104" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="540" height="104" fill="#fff"/><text x="270" y="14" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >瀬戸内工業地域の製造品出荷額の割合</text><rect x="10" y="38" width="182" height="34" fill="#e9a98f" stroke="#1d2a33" stroke-width="0.6"/><text x="101" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >機械 35%</text><rect x="192" y="38" width="114.4" height="34" fill="#c9b3dc" stroke="#1d2a33" stroke-width="0.6"/><text x="249.2" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >化学 22%</text><rect x="306.4" y="38" width="88.4" height="34" fill="#9dbcdc" stroke="#1d2a33" stroke-width="0.6"/><text x="350.6" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >金属 17%</text><rect x="394.8" y="38" width="41.6" height="34" fill="#a9cf98" stroke="#1d2a33" stroke-width="0.6"/><text x="415.6" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >8%</text><rect x="436.4" y="38" width="10.4" height="34" fill="#f0cf72" stroke="#1d2a33" stroke-width="0.6"/><text x="441.6" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >2%</text><rect x="446.8" y="38" width="83.2" height="34" fill="#eeeae0" stroke="#1d2a33" stroke-width="0.6"/><text x="488.4" y="55" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >その他 16%</text><text x="536" y="98" font-size="10" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >2019年。工業統計をもとにしたおおよその割合</text></svg>