<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="jrq" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs><rect width="760" height="250" fill="#fff"/><rect x="20" y="20" width="170" height="130" rx="8" fill="#f2dcc0" stroke="#888"/><rect x="93" y="30" width="24" height="24" rx="2" fill="#fff" stroke="#1d2a33" stroke-width="1.4"/><text x="105" y="42.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33">A</text><text x="105" y="66" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >約700万年前</text><text x="105" y="90" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >アフリカに出現</text><text x="105" y="109" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >直立二足歩行</text><text x="105" y="128" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >手で道具を使う</text><line x1="192" y1="85" x2="208" y2="85" stroke="#555" stroke-width="2.4" marker-end="url(#jrq)"/><rect x="210" y="20" width="170" height="130" rx="8" fill="#e9d6c6" stroke="#888"/><rect x="283" y="30" width="24" height="24" rx="2" fill="#fff" stroke="#1d2a33" stroke-width="1.4"/><text x="295" y="42.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33">B</text><text x="295" y="66" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >約200万年前</text><text x="295" y="90" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >火や言葉を使う</text><text x="295" y="109" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >石器をつくる</text><line x1="382" y1="85" x2="398" y2="85" stroke="#555" stroke-width="2.4" marker-end="url(#jrq)"/><rect x="400" y="20" width="170" height="130" rx="8" fill="#d6e3ef" stroke="#888"/><rect x="473" y="30" width="24" height="24" rx="2" fill="#fff" stroke="#1d2a33" stroke-width="1.4"/><text x="485" y="42.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33">C</text><text x="485" y="66" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >約20万年前</text><text x="485" y="90" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（　　　）</text><text x="485" y="109" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >現在の人類の祖先</text><text x="485" y="128" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >世界中に広がる</text><rect x="590" y="20" width="150" height="130" rx="8" fill="#dfeedd" stroke="#888"/><text x="665" y="42" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >約1万年前</text><text x="665" y="66" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >氷河時代が終わる</text><text x="665" y="85" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >農耕・牧畜が始まる</text><text x="665" y="104" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >土器をつくる</text><text x="665" y="123" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >定住する</text><rect x="20" y="168" width="550" height="34" fill="#efe6d6" stroke="#8f4a2f"/><text x="295" y="185" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >［ア］時代（［イ］石器・狩りや採集・移動生活）</text><rect x="590" y="168" width="150" height="34" fill="#e3efe0" stroke="#3b6a4c"/><text x="665" y="185" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#3b6a4c" >［ウ］時代</text><text x="665" y="222" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#3b6a4c" >（［エ］石器・土器）</text></svg>