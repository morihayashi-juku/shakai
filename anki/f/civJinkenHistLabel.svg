<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="760" height="210" fill="#fff"/><line x1="30" y1="120" x2="735" y2="120" stroke="#333" stroke-width="2"/><circle cx="60" cy="120" r="6" fill="#3b6a4c"/><text x="60" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1215年</text><text x="60" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >マグナ・カルタ</text><text x="60" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（イギリス）</text><circle cx="190" cy="120" r="6" fill="#3b6a4c"/><text x="190" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1689年</text><text x="190" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >権利章典</text><text x="190" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（イギリス）</text><circle cx="320" cy="120" r="6" fill="#3b6a4c"/><text x="320" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1776年</text><text x="320" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >独立宣言</text><text x="320" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（アメリカ）</text><circle cx="440" cy="120" r="6" fill="#3b6a4c"/><text x="440" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1789年</text><text x="440" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >人権宣言</text><text x="440" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（フランス）</text><circle cx="570" cy="120" r="6" fill="#3b6a4c"/><text x="570" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1919年</text><text x="570" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >ワイマール憲法</text><text x="570" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（ドイツ）</text><circle cx="700" cy="120" r="6" fill="#3b6a4c"/><text x="700" y="142" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1948年</text><text x="700" y="63.2" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >世界人権宣言</text><text x="700" y="80.8" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（国際連合）</text><text x="125" y="178" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >王の力を制限</text><text x="380" y="178" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >自由権・平等権</text><text x="570" y="178" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >社会権を初めて</text><text x="700" y="178" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8f4a2f" >人権を世界へ</text><text x="754" y="200" font-size="10.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#555" >17〜18世紀：ロック・モンテスキュー・ルソーの思想が革命を支えた</text></svg>