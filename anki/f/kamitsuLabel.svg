<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="kmlabel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2a33"/></marker></defs><rect width="600" height="200" fill="#fff"/><rect x="10" y="30" width="230" height="150" rx="6" fill="#eef4f8" stroke="#1d2a33"/><text x="125" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >過疎（農村・山間部・離島）</text><text x="24" y="78" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・若い人がへり、高齢者の割合が高い</text><text x="24" y="100" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・学校・病院・バスの路線がへる</text><text x="24" y="122" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・地域の行事や農林業の担い手不足</text><rect x="360" y="30" width="230" height="150" rx="6" fill="#fbeee8" stroke="#1d2a33"/><text x="475" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >過密（大都市）</text><text x="374" y="78" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・交通渋滞・通勤ラッシュ</text><text x="374" y="100" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・住宅の不足、地価が高い</text><text x="374" y="122" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >・ごみの増加、大気汚染</text><line x1="248" y1="105" x2="352" y2="105" stroke="#1d2a33" stroke-width="2.4" marker-end="url(#kmlabel)"/><text x="300" y="90" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >仕事や学校を</text><text x="300" y="124" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >求めて移動</text></svg>