<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="700" height="280" fill="#fff"/><rect x="30" y="100" width="200" height="80" rx="10" fill="#cfe3d2" stroke="#3b6a4c" stroke-width="1.4"/><text x="130" y="140" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国会</text><rect x="470" y="100" width="200" height="80" rx="10" fill="#f3ead0" stroke="#8f4a2f" stroke-width="1.4"/><text x="570" y="140" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >内閣</text><rect x="250" y="222" width="200" height="44" rx="10" fill="#dde6f2" stroke="#2c5f86" stroke-width="1.4"/><text x="350" y="244" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国民（選挙）</text><defs><marker id="ar25" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b6a4c"/></marker></defs><line x1="232" y1="118" x2="468" y2="118" stroke="#3b6a4c" stroke-width="2" marker-end="url(#ar25)"/><text x="350" y="92" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >内閣総理大臣を指名</text><text x="350" y="106" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >内閣不信任の決議（衆議院）</text><defs><marker id="ar26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8f4a2f"/></marker></defs><line x1="468" y1="164" x2="232" y2="164" stroke="#8f4a2f" stroke-width="2" marker-end="url(#ar26)"/><text x="350" y="178" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >衆議院の解散</text><text x="350" y="192" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国会に対して連帯して責任</text><defs><marker id="ar27" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c5f86"/></marker></defs><line x1="300" y1="222" x2="180" y2="182" stroke="#2c5f86" stroke-width="2" marker-end="url(#ar27)"/><text x="350" y="30" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >議院内閣制（内閣は国会の信任の上に成り立つ）</text><text x="350" y="56" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#555" >総理大臣は国会議員から選ばれ、国務大臣の過半数も国会議員</text></svg>