<svg viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="720" height="150" fill="#fff"/><text x="360" y="14" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >冠位十二階（冠の色で位を区別した）</text><rect x="20" y="32" width="105" height="60" rx="6" fill="#7b4fa0" stroke="#555"/><text x="72" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >大徳</text><text x="72" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >小徳</text><rect x="137" y="32" width="105" height="60" rx="6" fill="#2f6fb0" stroke="#555"/><text x="189" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >大仁</text><text x="189" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >小仁</text><rect x="254" y="32" width="105" height="60" rx="6" fill="#c0392b" stroke="#555"/><text x="306" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >大礼</text><text x="306" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >小礼</text><rect x="371" y="32" width="105" height="60" rx="6" fill="#d9b400" stroke="#555"/><text x="423" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#222" >大信</text><text x="423" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#222" >小信</text><rect x="488" y="32" width="105" height="60" rx="6" fill="#ffffff" stroke="#555"/><text x="540" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#222" >大義</text><text x="540" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#222" >小義</text><rect x="605" y="32" width="105" height="60" rx="6" fill="#333333" stroke="#555"/><text x="657" y="50" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >大智</text><text x="657" y="76" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#fff" >小智</text><line x1="20" y1="112" x2="700" y2="112" stroke="#555" stroke-width="1.5"/><text x="20" y="128" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >← 位が高い</text><text x="700" y="128" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >位が低い →</text><text x="360" y="136" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#8e2a1f" >家柄ではなく、才能や功績で役人に取り立てる</text></svg>