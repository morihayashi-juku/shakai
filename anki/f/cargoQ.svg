<svg viewBox="0 0 520 142" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="520" height="142" fill="#fff"/><text x="260" y="14" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国内の貨物輸送の割合（輸送量×距離）</text><text x="62" y="52" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >1960年</text><rect x="70" y="36" width="171.6" height="32" fill="#9dbcdc" stroke="#1d2a33" stroke-width="0.6"/><text x="155.8" y="52" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >A 39%</text><rect x="241.6" y="36" width="66" height="32" fill="#e9a98f" stroke="#1d2a33" stroke-width="0.6"/><text x="274.6" y="52" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >B 15%</text><rect x="307.6" y="36" width="202.4" height="32" fill="#a9cf98" stroke="#1d2a33" stroke-width="0.6"/><text x="408.8" y="52" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >C 46%</text><text x="62" y="94" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >2020年</text><rect x="70" y="78" width="22" height="32" fill="#9dbcdc" stroke="#1d2a33" stroke-width="0.6"/><text x="81" y="94" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >5%</text><rect x="92" y="78" width="242" height="32" fill="#e9a98f" stroke="#1d2a33" stroke-width="0.6"/><text x="213" y="94" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >B 55%</text><rect x="334" y="78" width="176" height="32" fill="#a9cf98" stroke="#1d2a33" stroke-width="0.6"/><text x="422" y="94" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >C 40%</text><text x="70" y="136" font-size="10" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >※航空はわずかなので省略</text><text x="516" y="138" font-size="10" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >国土交通省の資料をもとにしたおおよその割合</text></svg>