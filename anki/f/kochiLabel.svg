<svg viewBox="0 0 520 190" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="520" height="190" fill="#fff"/><text x="260" y="14" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >全国の耕地面積の変化（おおよそ）</text><line x1="140" y1="36" x2="140" y2="154" stroke="#e1e5e8"/><text x="140" y="165" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >0万町歩</text><line x1="243.1" y1="36" x2="243.1" y2="154" stroke="#e1e5e8"/><text x="243.1" y="165" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >100万町歩</text><line x1="346.3" y1="36" x2="346.3" y2="154" stroke="#e1e5e8"/><text x="346.3" y="165" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >200万町歩</text><line x1="449.4" y1="36" x2="449.4" y2="154" stroke="#e1e5e8"/><text x="449.4" y="165" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >300万町歩</text><text x="132" y="59" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >室町時代の中ごろ</text><rect x="140" y="47" width="98" height="24" fill="#9db7d0"/><text x="243" y="59" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >約95万</text><text x="132" y="97" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >1600年ごろ</text><rect x="140" y="85" width="169.1" height="24" fill="#9db7d0"/><text x="314.1" y="97" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >約164万</text><text x="132" y="135" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >18世紀の初め</text><rect x="140" y="123" width="306.3" height="24" fill="#b5513c"/><text x="451.3" y="135" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >約297万</text><text x="516" y="184" font-size="9.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >1町歩は約1ヘクタール。歴史統計をもとにしたおおよその値</text></svg>