<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="680" height="260" fill="#fff"/><rect x="30" y="70" width="190" height="70" rx="10" fill="#f3ead0" stroke="#8f4a2f" stroke-width="1.4"/><rect x="113" y="86" width="24" height="24" rx="2" fill="#fff" stroke="#1d2a33" stroke-width="1.4"/><text x="125" y="98.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >A</text><text x="125" y="124" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（知事・市町村長）</text><rect x="460" y="70" width="190" height="70" rx="10" fill="#cfe3d2" stroke="#3b6a4c" stroke-width="1.4"/><rect x="543" y="93" width="24" height="24" rx="2" fill="#fff" stroke="#1d2a33" stroke-width="1.4"/><text x="555" y="105.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >B</text><defs><marker id="ar57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8f4a2f"/></marker></defs><line x1="222" y1="88" x2="458" y2="88" stroke="#8f4a2f" stroke-width="1.8" marker-end="url(#ar57)"/><text x="340" y="76" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >議会の解散・議決のやり直し（拒否権）</text><defs><marker id="ar58" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b6a4c"/></marker></defs><line x1="458" y1="124" x2="222" y2="124" stroke="#3b6a4c" stroke-width="1.8" marker-end="url(#ar58)"/><text x="340" y="140" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >首長の不信任の議決</text><rect x="250" y="200" width="180" height="44" rx="10" fill="#dde6f2" stroke="#2c5f86" stroke-width="1.4"/><text x="340" y="222" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >住民</text><defs><marker id="ar59" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c5f86"/></marker></defs><line x1="300" y1="198" x2="160" y2="144" stroke="#2c5f86" stroke-width="1.8" marker-end="url(#ar59)"/><defs><marker id="ar60" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c5f86"/></marker></defs><line x1="380" y1="198" x2="520" y2="144" stroke="#2c5f86" stroke-width="1.8" marker-end="url(#ar60)"/><text x="200" y="186" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#2c5f86" >選挙</text><text x="480" y="186" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2c5f86" >選挙</text><text x="340.0" y="24" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >首長と議員を、住民がそれぞれ直接選ぶ（二元代表制）</text></svg>