<svg viewBox="0 0 740 250" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="fulabel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f4a2f"/></marker></defs><rect width="740" height="250" fill="#fff"/><rect x="20" y="88" width="120" height="74" rx="10" fill="#f3dccc" stroke="#8f4a2f" stroke-width="1.4"/><text x="80" y="112" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >農民</text><text x="80" y="138" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >口分田を耕す</text><line x1="142" y1="125" x2="200" y2="32" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#fulabel)"/><rect x="204" y="14" width="74" height="36" rx="5" fill="#f6efe4" stroke="#8f4a2f"/><text x="241" y="32" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >租</text><text x="290" y="32" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >稲（収穫の約3%）</text><text x="560" y="32" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#555" >国に納める</text><line x1="142" y1="125" x2="200" y2="78" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#fulabel)"/><rect x="204" y="60" width="74" height="36" rx="5" fill="#f6efe4" stroke="#8f4a2f"/><text x="241" y="78" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >調</text><text x="290" y="78" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >地方の特産物</text><text x="560" y="78" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#555" >都に運ぶ</text><line x1="142" y1="125" x2="200" y2="124" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#fulabel)"/><rect x="204" y="106" width="74" height="36" rx="5" fill="#f6efe4" stroke="#8f4a2f"/><text x="241" y="124" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >庸</text><text x="290" y="124" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >労役のかわりに布</text><text x="560" y="124" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#555" >都に運ぶ</text><line x1="142" y1="125" x2="200" y2="170" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#fulabel)"/><rect x="204" y="152" width="74" height="36" rx="5" fill="#f6efe4" stroke="#8f4a2f"/><text x="241" y="170" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >雑徭</text><text x="290" y="170" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >地方で労役（年60日以内）</text><text x="560" y="170" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#555" >国のために働く</text><line x1="142" y1="125" x2="200" y2="216" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#fulabel)"/><rect x="204" y="198" width="74" height="36" rx="5" fill="#f6efe4" stroke="#8f4a2f"/><text x="241" y="216" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >兵役</text><text x="290" y="216" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1d2a33" >防人（九州の守り）など</text><text x="560" y="216" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#555" >兵士になる</text></svg>