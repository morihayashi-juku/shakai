<svg viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="660" height="310" fill="#fff"/><rect x="10" y="30" width="250" height="244" rx="12" fill="#eef3f8" stroke="#2563a8" stroke-width="1.4"/><text x="135" y="16" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563a8" >西側（資本主義の国々）</text><text x="135" y="60" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >アメリカが中心</text><text x="135" y="98" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >イギリス・フランス・西ドイツなど</text><text x="135" y="136" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >軍事同盟：北大西洋条約機構</text><text x="135" y="174" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（NATO・1949年）</text><text x="135" y="212" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >日本も日米安全保障条約で</text><text x="135" y="250" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >西側の一員に</text><rect x="400" y="30" width="250" height="244" rx="12" fill="#fbeee6" stroke="#c0392b" stroke-width="1.4"/><text x="525" y="16" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" >東側（社会主義の国々）</text><text x="525" y="60" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >ソ連が中心</text><text x="525" y="98" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >東ドイツ・ポーランドなど</text><text x="525" y="136" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >軍事同盟：ワルシャワ条約機構</text><text x="525" y="174" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >（1955年）</text><text x="525" y="212" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >中華人民共和国（1949年）も</text><text x="525" y="250" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >社会主義の国に</text><line x1="268" y1="140" x2="392" y2="140" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="330" y="124" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >冷戦</text><text x="330" y="160" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >直接は戦わない</text><text x="330" y="178" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >きびしい対立</text><rect x="150" y="280" width="360" height="26" rx="6" fill="#fff8e8" stroke="#b07a1a"/><text x="330" y="293" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >分断された国：ドイツ（東西）、朝鮮（南北）</text></svg>