<svg viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="700" height="170" fill="#fff"/><text x="350" y="14" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >1865年の日本のおもな輸出品と輸入品（金額の割合）</text><text x="70" y="50" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >輸出</text><rect x="80" y="32" width="474" height="36" fill="#e9a98f" stroke="#333" stroke-width="0.6"/><text x="317" y="50" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >生糸 79%</text><rect x="554" y="32" width="66" height="36" fill="#a9cf98" stroke="#333" stroke-width="0.6"/><text x="587" y="50" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >茶 11%</text><rect x="620" y="32" width="60" height="36" fill="#eeeae0" stroke="#333" stroke-width="0.6"/><text x="650" y="50" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >その他 10%</text><text x="70" y="118" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1d2a33" >輸入</text><rect x="80" y="100" width="240" height="36" fill="#9dbcdc" stroke="#333" stroke-width="0.6"/><text x="200" y="118" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >毛織物 40%</text><rect x="320" y="100" width="204" height="36" fill="#e9c98f" stroke="#333" stroke-width="0.6"/><text x="422" y="118" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >綿織物 34%</text><rect x="524" y="100" width="42" height="36" fill="#c0a0a0" stroke="#333" stroke-width="0.6"/><text x="545" y="148" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >武器</text><rect x="566" y="100" width="36" height="36" fill="#a0b8a0" stroke="#333" stroke-width="0.6"/><text x="584" y="148" font-