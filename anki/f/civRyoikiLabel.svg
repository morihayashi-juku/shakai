<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect width="720" height="280" fill="#fff"/><text x="360.0" y="16" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >国の領域（領土・領海・領空）と排他的経済水域</text><path d="M20 200 L190 200 L190 230 L20 230 Z" fill="#e9dcc0" stroke="#8a7a5a"/><rect x="190" y="200" width="510" height="30" fill="#dbe9f3"/><path d="M20 200 Q 120 60 260 60 L260 200 Z" fill="#ffffff"/><rect x="20" y="70" width="240" height="128" fill="#fdf3e1" stroke="#c9a868" stroke-dasharray="5 4"/><line x1="190" y1="194" x2="190" y2="246" stroke="#555"/><line x1="260" y1="194" x2="260" y2="246" stroke="#555"/><line x1="610" y1="194" x2="610" y2="246" stroke="#555"/><defs><marker id="ar77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2a33"/></marker></defs><line x1="192" y1="252" x2="258" y2="252" stroke="#1d2a33" stroke-width="1.4" marker-end="url(#ar77)" marker-start="url(#ar77)"/><defs><marker id="ar78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2a33"/></marker></defs><line x1="262" y1="252" x2="608" y2="252" stroke="#1d2a33" stroke-width="1.4" marker-end="url(#ar78)" marker-start="url(#ar78)"/><text x="225" y="268" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >12海里</text><text x="435" y="268" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >200海里（約370km）</text><text x="105" y="215" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >領土</text><text x="225" y="215" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >領海</text><text x="140" y="120" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >領空</text><text x="435" y="215" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >排他的経済水域</text><text x="660" y="215" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >公海</text><text x="435" y="170" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2c5f86" >魚や海底の資源は沿岸国のもの</text><text x="660" y="170" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2c5f86" >どの国も自由に使える</text><text x="140" y="90" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#8a6a2a" >領土と領海の上空</text></svg>