<svg viewBox="0 0 580 170" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs><marker id="bioa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2a33"/></marker></defs><rect x="6" y="48" width="150" height="68" rx="6" fill="#f5f2ea" stroke="#1d2a33"/><text x="81" y="72" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >さとうきび</text><text x="81" y="96" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >育つときCO₂を吸収</text><rect x="215" y="48" width="150" height="68" rx="6" fill="#f5f2ea" stroke="#1d2a33"/><text x="290" y="72" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >バイオエタノール</text><text x="290" y="96" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >工場でつくる燃料</text><rect x="424" y="48" width="150" height="68" rx="6" fill="#f5f2ea" stroke="#1d2a33"/><text x="499" y="72" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >自動車の燃料</text><text x="499" y="96" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >燃やすとCO₂を出す</text><line x1="158" y1="82" x2="211" y2="82" stroke="#1d2a33" stroke-width="2" marker-end="url(#bioa)"/><line x1="367" y1="82" x2="420" y2="82" stroke="#1d2a33" stroke-width="2" marker-end="url(#bioa)"/><path d="M499 120 Q499 162 290 162 Q81 162 81 122" fill="none" stroke="#3c7a5a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#bioa)"/><text x="290" y="150" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2f5f45" paint-order="stroke" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">出したCO₂を、次に育つさとうきびが吸収する</text><text x="290" y="18" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a33" >バイオ燃料（バイオエタノール）</text></svg>