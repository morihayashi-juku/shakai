<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中学社会 暗記カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2433; --sub:#5d6678; --line:#d8dce4; --paper:#ffffff; --bg:#eef0f3;
  --ok:#1f8a4c; --ng:#c8372d; --accent:#13806f; --accent-soft:#e3f2ef;
  --r:14px;
}
body.his{--accent:#3f4fa8;--accent-soft:#e7e9f6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'BIZ UDPGothic',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible+span,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
[hidden]{display:none!important}

/* ---------- ホーム ---------- */
header.top{padding:22px 0 10px}
header.top h1{font-size:23px;margin:0;letter-spacing:.02em}
header.top p{margin:2px 0 0;color:var(--sub);font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0 12px;background:#dfe2e8;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:10px 0;border-radius:9px;font-weight:700;color:var(--sub)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--accent);box-shadow:0 1px 2px rgba(29,36,51,.15)}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;font-size:14px;color:var(--sub)}
.listhead button{color:var(--accent);font-weight:700;padding:4px 6px}
ul.units{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
ul.units li+li{border-top:1px solid var(--line)}
ul.units label{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
ul.units input{position:absolute;opacity:0;pointer-events:none}
.box{width:24px;height:24px;border:2px solid #aab1be;border-radius:6px;display:grid;place-items:center}
input:checked+.box{background:var(--accent);border-color:var(--accent)}
input:checked+.box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.uname{min-width:0}
.uname small{display:block;color:var(--sub);font-size:12.5px;line-height:1.3}
.uname b{font-weight:700;font-size:16px}
.meter{width:76px;text-align:right;font-size:12.5px;color:var(--sub);line-height:1.3}
.meter i{display:block;height:6px;border-radius:3px;background:#e3e6ec;margin-top:4px;overflow:hidden}
.meter i span{display:block;height:100%;background:var(--ok);border-radius:3px}
.meter.done{color:var(--ok);font-weight:700}

.dock{position:sticky;bottom:0;margin-top:16px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(238,240,243,0),var(--bg) 18px)}
.opts{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:8px;font-size:14px}
.opt>span{color:var(--sub)}
.seg{display:flex;background:#eef0f3;border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 2px;border-radius:7px;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(29,36,51,.15)}
.start{display:block;width:100%;margin-top:10px;padding:15px;border-radius:var(--r);background:var(--accent);color:#fff;font-weight:700;font-size:18px}
.start:disabled{background:#b7bcc6}
.foot{color:var(--sub);font-size:12.5px;text-align:center;margin:18px 0 8px}
.foot button{color:var(--sub);text-decoration:underline;font-size:12.5px}

/* ---------- 問題 ---------- */
.qbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.qbar .x{font-size:15px;color:var(--sub);padding:6px 8px 6px 0}
.prog{flex:1;height:8px;background:#dfe2e8;border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:14px;color:var(--sub);min-width:4.5em;text-align:right}
.card{background:var(--paper);border-radius:18px;border:1px solid var(--line);padding:22px 20px 20px;position:relative;min-height:240px;
  box-shadow:0 2px 0 #d3d7df}
.card .tag{font-size:12.5px;color:var(--accent);font-weight:700}
.card .note{font-size:13px;color:var(--sub);margin-top:2px}
.card .q{font-size:20px;line-height:1.65;margin:12px 0 0;font-weight:700;word-break:normal;overflow-wrap:anywhere}
.ans{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.ans .a{font-size:24px;font-weight:700;color:var(--ng);line-height:1.5;overflow-wrap:anywhere}
.ans .a.long{font-size:18px}
.ans .ex{font-size:14px;color:var(--sub);margin-top:8px}
.choices{display:grid;gap:10px;margin-top:16px}
.choices button{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;display:flex;gap:10px}
.choices button .k{color:var(--sub);font-weight:700}
.choices button.right{border-color:var(--ok);background:#e6f4ec}
.choices button.wrong{border-color:var(--ng);background:#fbe9e7}
.choices button:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tf button{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 0;font-size:34px;font-weight:700;line-height:1.2}
.tf button.right{border-color:var(--ok);background:#e6f4ec}
.tf button.wrong{border-color:var(--ng);background:#fbe9e7}
.verdict{margin-top:14px;font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions.one{grid-template-columns:1fr}
.actions button{padding:16px 0;border-radius:14px;font-weight:700;font-size:17px;background:var(--paper);border:2px solid var(--line)}
.actions .show{background:var(--accent);border-color:var(--accent);color:#fff}
.actions .good{background:var(--ok);border-color:var(--ok);color:#fff}
.actions .bad{background:var(--paper);border-color:var(--ng);color:var(--ng)}
.actions .next{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}

/* ---------- 結果 ---------- */
.result{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:20px;text-align:center}
.result .score{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0}
.result .score small{font-size:20px;color:var(--sub)}
.result p{margin:4px 0;color:var(--sub)}
.misslist{list-style:none;padding:0;margin:16px 0 0;text-align:left}
.misslist li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.misslist li b{color:var(--ng);display:block}

/* ---------- ダイアログ ---------- */
.dlg{position:fixed;inset:0;background:rgba(29,36,51,.45);display:grid;place-items:center;padding:20px;z-index:9}
.dlg>div{background:var(--paper);border-radius:16px;padding:20px;max-width:360px;width:100%}
.dlg p{margin:0 0 14px}
.dlg .actions{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="home" class="wrap">
  <header class="top">
    <h1>中学社会 暗記カード</h1>
    <p>講を選んで、問題をどんどん解いて覚えよう</p>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="listhead"><span id="sum"></span><button id="allbtn" type="button">すべて選ぶ</button></div>
  <ul class="units" id="units"></ul>
  <div class="dock">
    <div class="opts">
      <div class="opt"><span>出す問題</span><div class="seg" id="o-range"></div></div>
      <div class="opt"><span>答え方</span><div class="seg" id="o-how"></div></div>
      <div class="opt"><span>問題数</span><div class="seg" id="o-num"></div></div>
    </div>
    <button class="start" id="start" type="button"></button>
  </div>
  <p class="foot">覚えたかどうかは、この端末だけに記録されます。<button id="reset" type="button">記録を消す</button></p>
</div>

<div id="quiz" class="wrap" hidden>
  <div class="qbar">
    <button class="x" id="quit" type="button">← やめる</button>
    <div class="prog"><span id="pbar"></span></div>
    <div class="count" id="pcount"></div>
  </div>
  <div class="card" id="card"></div>
  <div id="ctrl"></div>
</div>

<div id="done" class="wrap" hidden></div>
<div class="dlg" id="dlg" hidden><div><p id="dlgmsg"></p><div class="actions"><button type="button" id="dlgno">やめない</button><button type="button" class="bad" id="dlgyes"></button></div></div></div>

function pool(){
  const s=subj(),sel=pref.sel[s.id]||[];let items=[];
  for(const u of s.units) if(sel.includes(u.id)) for(const it of u.items) items.push(Object.assign({u},it));
  if(pref.range==='todo') items=items.filter(it=>st(it.i)!=='ok');
  if(pref.range==='miss') items=items.filter(it=>st(it.i)==='ng');
  return items;
}
function renderHome(){
  const s=subj(); document.body.className=s.id;
  $('tabs').innerHTML=DATA.map(x=>`<button type="button" role="tab" data-s="${x.id}" aria-selected="${x.id===s.id}">${x.name}</button>`).join('');
  const sel=pref.sel[s.id]||[];
  let tot=0,ok=0;
  $('units').innerHTML=s.units.map(u=>{
    const n=u.items.length,k=u.items.filter(it=>st(it.i)==='ok').length,m=u.items.filter(it=>st(it.i)==='ng').length;
    tot+=n;ok+=k;
    const pct=Math.round(k/n*100);
    return `<li><label><input type="checkbox" data-u="${u.id}" ${sel.includes(u.id)?'checked':''}><span class="box"></span>
      <span class="uname"><small>${esc(u.label)}</small><b>${esc(u.title)}</b></span>
      <span class="meter${k===n?' done':''}">${k===n?'ぜんぶ覚えた':`${k}／${n}`}${m?`<br><span style="color:var(--ng)">×${m}</span>`:''}<i><span style="width:${pct}%"></span></i></span></label></li>`;
  }).join('');
  $('sum').textContent=`覚えた問題 ${ok}／${tot}`;
  $('allbtn').textContent=sel.length===s.units.length?'選ぶのをやめる':'すべて選ぶ';
  seg($('o-range'),RANGES,'range');seg($('o-how'),HOWS,'how');seg($('o-num'),NUMS,'num');
  const p=pool().length,n=pref.num==='all'?p:Math.min(p,+pref.num);
  const b=$('start');
  b.disabled=!n;
  b.textContent=!sel.length?'講を選んでください':!p?(pref.range==='miss'?'まちがえた問題はありません':'この範囲はぜんぶ覚えました'):`${n}問はじめる`;
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;pref.subj=b.dataset.s;savePref();renderHome()};
$('units').onchange=e=>{const id=e.target.dataset.u,s=subj();let sel=pref.sel[s.id]||[];
  sel=e.target.checked?[...sel,id]:sel.filter(x=>x!==id);pref.sel[s.id]=sel;savePref();renderHome()};
$('allbtn').onclick=()=>{const s=subj(),sel=pref.sel[s.id]||[];pref.sel[s.id]=sel.length===s.units.length?[]:s.units.map(u=>u.id);savePref();renderHome()};
$('reset').onclick=()=>ask('覚えた・まちがえたの記録をすべて消しますか？','消す',()=>{rec={};save();renderHome()});

function ask(msg,yes,fn){$('dlgmsg').textContent=msg;$('dlgyes').textContent=yes;$('dlg').hidden=false;
  $('dlgyes').onclick=()=>{$('dlg').hidden=true;fn()};$('dlgno').onclick=()=>{$('dlg').hidden=true};$('dlgno').focus()}

// ---------- 問題 ----------
let Q=[],qi=0,res=[];
function start(items){
  Q=items;qi=0;res=[];
  $('home').hidden=true;$('done').hidden=true;$('quiz').hidden=false;window.scrollTo(0,0);show();
}
$('start').onclick=()=>{let p=shuffle(pool());if(pref.num!=='all')p=p.slice(0,+pref.num);start(p)};
$('quit').onclick=()=>{if(res.length) ask(`ここまで${res.length}問解きました。やめますか？`,'やめる',finish);else home()};
function home(){$('quiz').hidden=true;$('done').hidden=true;$('home').hidden=false;renderHome();window.scrollTo(0,0)}

// 4択の選択肢：同じ講の答えから、答えの終わり方が似ているものを優先して3つ選ぶ
function distract(it){
  const strip=c=>c.replace(/（.*?）/g,'');
  const ans=it.a,A=strip(ans),num=/^[0-9０-９]/.test(A),unit=num?A.replace(/^[0-9０-９,.・〜]+/,''):'';
  const cue=q=>{const m=q.match(/(だれ|どこ|何年|何世紀|何時代|何県|何市|何州|何川|何山脈|何平野|何という|何か|いくつ|何割|何%)/g);return m?m[m.length-1]:''};
  const qc=cue(it.q);
  const ok=c=>{const t=strip(c);if(c===ans||ans.includes(t)||t.includes(A)||/→|^[アイウエ○×]$/.test(c)||t.length>14)return false;
    const n=/^[0-9０-９]/.test(t);if(num!==n)return false;if(num&&t.replace(/^[0-9０-９,.・〜]+/,'')!==unit)return false;return true};
  const mine=new Set(it.u.items.map(x=>x.a));
  const cueOf=new Map();
  const all=subj().units.flatMap(u=>u.items).filter(x=>x.t==='k'&&ok(x.a));
  for(const x of all){if(!cueOf.has(x.a))cueOf.set(x.a,new Set());cueOf.get(x.a).add(cue(x.q))}
  const cands=[...cueOf.keys()];
  const sc=c=>{const t=strip(c);let v=mine.has(c)?3:0;
    if(qc&&qc!=='何か'&&qc!=='何という'&&cueOf.get(c).has(qc))v+=6;
    if(t.slice(-1)===A.slice(-1))v+=4; if(t.slice(-2)===A.slice(-2))v+=4;
    v-=Math.abs(t.length-A.length)*.4; return v+Math.random()*2.5};
  return cands.map(c=>[c,sc(c)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
}
// 数字の選択肢（年など）は小さい順、それ以外はシャッフル
function order(pairs){
  if(pairs.every(([c])=>/^[0-9０-９]/.test(c))) return pairs.slice().sort((x,y)=>parseFloat(x[0].replace(/[^0-9.]/g,''))-parseFloat(y[0].replace(/[^0-9.]/g,'')));
  return shuffle(pairs);
}
function head(it){return `<div class="tag">${esc(it.u.label)} ${esc(it.u.title)}</div>${it.n?`<div class="note">${esc(it.n)}</div>`:''}<p class="q">${esc(it.q)}</p>`}
function mark(it,ok){rec[it.i]=ok?1:0;save();res.push({it,ok})}
function nextBtn(){return `<div class="actions one"><button type="button" class="next" id="nx">${qi+1<Q.length?'次の問題':'結果を見る'}</button></div>`}
function bindNext(){const b=$('nx');b.onclick=()=>{qi++;qi<Q.length?show():finish()};b.focus()}
function show(){
  const it=Q[qi];
  $('pbar').style.width=(qi/Q.length*100)+'%';$('pcount').textContent=`${qi+1}／${Q.length}`;
  const card=$('card'),ctrl=$('ctrl');
  let mode=it.t;
  if(mode==='k'&&pref.how==='pick'&&!/→/.test(it.a)){const d=distract(it);if(d.length===3){mode='pk';it._c=[it.a,...d];}}
  if(mode==='m'||mode==='pk'){
    const cs=order(mode==='m'?it.c.map((c,k)=>[c,k]):it._c.map(c=>[c,c===it.a?it.a:-1]));
    const right=it.a;
    card.innerHTML=head(it)+`<div class="choices">${cs.map(([c,k],j)=>`<button type="button" data-k="${esc(k)}"><span class="k">${KANA[j]}</span><span>${esc(c)}</span></button>`).join('')}</div><div id="vd"></div>`;
    ctrl.innerHTML='';
    card.querySelector('.choices').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      const ok=String(b.dataset.k)===String(right);
      card.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;if(String(x.dataset.k)===String(right))x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      $('vd').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}</div>`;
      mark(it,ok);ctrl.innerHTML=nextBtn();bindNext()};
  }else if(mode==='t'){
    card.innerHTML=head(it)+`<div class="tf"><button type="button" data-v="○" aria-label="正しい">○</button><button type="button" data-v="×" aria-label="まちがい">×</button></div><div id="vd"></div>`;
    ctrl.innerHTML='';
    card.querySelector('.tf').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      const ok=b.dataset.v===it.a;
      card.querySelectorAll('.tf button').forEach(x=>{x.disabled=true;if(x.dataset.v===it.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      $('vd').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}　答えは ${it.a}</div>`;
      mark(it,ok);ctrl.innerHTML=nextBtn();bindNext()};
  }else{
    card.innerHTML=head(it)+`<div class="ans" id="ans" hidden><div class="a${it.a.length>16?' long':''}">${esc(it.a)}</div>${it.x?`<div class="ex">${esc(it.x)}</div>`:''}</div>`;
    ctrl.innerHTML=`<div class="actions one"><button type="button" class="show" id="sh">答えを見る</button></div><p class="hint">${it.t==='e'?'自分の言葉で言えるか、頭の中で答えてからめくろう':'頭の中で答えてからめくろう'}</p>`;
    $('sh').onclick=()=>{$('ans').hidden=false;
      ctrl.innerHTML=`<div class="actions"><button type="button" class="bad" id="ng">まだ</button><button type="button" class="good" id="ok">覚えてた</button></div>`;
      $('ok').onclick=()=>{mark(it,true);go()};$('ng').onclick=()=>{mark(it,false);go()};$('ok').focus()};
  }
  function go(){qi++;qi<Q.length?show():finish()}
}
function finish(){
  $('quiz').hidden=true;const d=$('done');d.hidden=false;window.scrollTo(0,0);
  const ok=res.filter(r=>r.ok).length,miss=res.filter(r=>!r.ok);
  d.innerHTML=`<div class="result"><p>${res.length}問中</p><div class="score">${ok}<small> 問正解</small></div>
    <p>${!res.length?'':ok===res.length?'ぜんぶ正解！':'まちがえた問題は、もう一度やると覚えやすい'}</p>
    <div class="actions${miss.length?'':' one'}" style="margin-top:16px">${miss.length?`<button type="button" class="show" id="again">まちがえた${miss.length}問をもう一度</button>`:''}<button type="button" id="back">講の一覧へ</button></div>
    ${miss.length?`<ul class="misslist">${miss.map(r=>`<li>${esc(r.it.q)}<b>${esc(r.it.t==='m'?r.it.c[r.it.a]:r.it.a)}</b></li>`).join('')}</ul>`:''}</div>`;
  $('back').onclick=home;
  if(miss.length)$('again').onclick=()=>start(shuffle(miss.map(r=>r.it)));
}
renderHome();
</script>
